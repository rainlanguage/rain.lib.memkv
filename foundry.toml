[profile.default]

# See more config options https://www.getfoundry.sh/config/reference/overview

solc = "0.8.25"

optimizer = true
optimizer_runs = 100000

evm_version = "cancun"

libs = ["dependencies"]

# Read only: tests check that these files state the figures the tests pin.
fs_permissions = [
  { access = "read", path = "./README.md" },
  { access = "read", path = "./src/lib/LibMemoryKV.sol" },
]

[fuzz]
runs = 1024

[dependencies]
forge-std = "1.16.1"
"rain-solmem" = "0.1.28"
"rain-lib-hash" = "0.1.27"

[soldeer]
recursive_deps = false
